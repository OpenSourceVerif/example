[workspace]
members = [
    "crates/interner",
    "crates/interner-derive",
    "crates/scoped-tls",
    "crates/verifier-core",
    "crates/verifier-driver",
    "crates/verifier-rustc",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bumpalo = "3.20.3"
hashbrown = "0.17.1"
index_vec = "0.1.4"
smallvec = { version = "1", features = ["const_generics"] }
fixedbitset = "0.5.7"
interner = { path = "crates/interner" }
interner-derive = { path = "crates/interner-derive" }
quote = "1"
scoped-tls = { path = "crates/scoped-tls" }
syn = "2"
verifier-core = { path = "crates/verifier-core" }
verifier-rustc = { path = "crates/verifier-rustc" }
