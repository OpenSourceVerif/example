name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: >-
          rustup toolchain install nightly-2026-07-07
          --profile minimal
          --component rustc-dev
          --component llvm-tools
          --component rustfmt

      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: 1.47.1

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install --yes z3

      - name: Run CI checks
        run: just ci
